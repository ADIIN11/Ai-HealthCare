<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join NovaHealth | Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/signup.css">
</head>
<body>

    <div class="signup-container">
        <div class="signup-card">
            <div class="brand-section">
                <i class="fa-solid fa-hand-holding-medical"></i>
                <span>NovaHealth</span>
            </div>
            
            <h2>Create Account</h2>
            <p class="subtitle">Join our stellar health community today</p>

            <form id="signupForm" novalidate>
                <!-- Email -->
                <div class="input-group">
                    <label><i class="fa-solid fa-envelope"></i> Gmail Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                    <span class="error-msg" id="emailError"></span>
                </div>

                <!-- Username -->
                <div class="input-group">
                    <label><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="johndoe123">
                    <span class="error-msg" id="usernameError"></span>
                </div>

                <!-- Blood Group -->
                <div class="input-group">
                    <label><i class="fa-solid fa-droplet"></i> Blood Group</label>
                    <select id="bloodGroup">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                    <span class="error-msg" id="bloodError"></span>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label><i class="fa-solid fa-shield-check"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••">
                    <span class="error-msg" id="confirmError"></span>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="#">Login</a>
            </div>
        </div>
    </div>

    <script src="/signup.js"></script>
</body>
</html>
