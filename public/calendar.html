<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Calendar | NovaHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- MUST INCLUDE AXIOS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/calendar.css">
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <!-- Add Reminder Modal -->
    <div class="modal" id="reminderModal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>Schedule Reminder</h3>
                <p id="selectedDateText" class="ist-label">IST Timezone</p>
            </div>
            <div class="input-field">
                <label>Reminder Title</label>
                <input type="text" id="reminderInput" placeholder="e.g. Vitamin Intake">
            </div>
            <div class="input-field">
                <label>Select Time (IST)</label>
                <input type="time" id="timeInput">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveReminder()">Set Reminder</button>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo-box">
                <img src="/assets/logo.jpeg" alt="Logo" class="header-logo"> 
            </div>
            <span>Ai-HealthCare</span>
        </div>
        <ul class="nav-links">
            <li onclick="location.href='/'"><i class="fa-solid fa-grip"></i> Overview</li>
            <li class="active-nav"><i class="fa-solid fa-calendar-days"></i> Calendar</li>
            <li><i class="fa-solid fa-user-doctor"></i> My Doctors</li>
            <li><i class="fa-solid fa-gear"></i> Settings</li>
            <li id="signOutBtn" class="hidden" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <div class="header-left">
                <div class="menu-trigger" id="menuBtn">
                    <i class="fa-solid fa-bars-staggered"></i>
                </div>
                <img src="/assets/logo.jpeg" alt="Logo" class="header-logo" style="width: 3.5rem; border-radius: 8px;">
            </div>
            
            <!-- Auth Buttons (Signed Out State) -->
            <div id="authSection" class="auth-btns-container">
                <button class="btn-signin" onclick="window.location.href='/Auth/Sign_In';">Sign In</button>
                <button class="btn-signup" onclick="window.location.href='/Auth/Sign_Up';">Sign Up</button>
            </div>

            <!-- User Profile (Signed In State) -->
            <div id="userSection" class="user-info hidden">
                <div class="profile-meta">
                    <h4 class="user-greeting" style="text-align: right;">Hi, <span id="userName">User</span>!</h4>
                </div>
                <div class="user-avatar" id="userAvatar">U</div>
            </div>
        </header>

        <!-- Calendar Card -->
        <section class="glass-card calendar-container">
            <div class="cal-nav">
                <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="month-display" style="margin-bottom: 20px;">
                <h4 id="currentMonthYear">Month Year</h4>
            </div>
            <div class="calendar-grid weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="calendar-grid" id="calendarDays"></div>
        </section>

        <div class="section-header"><h3>Health Schedule</h3></div>
        <div id="reminderListContainer" class="reminder-list">
            <div class="empty-state">
                <i class="fa-solid fa-calendar-day"></i>
                <p>Select a date to manage IST reminders.</p>
            </div>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>
