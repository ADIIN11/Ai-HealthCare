<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-section">
                <i class="fa-solid fa-hand-holding-medical"></i>
                <span>NovaHealth</span>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your credentials to access your dashboard</p>

            <form id="loginForm" novalidate>
                <!-- Gmail / Username -->
                <div class="input-group">
                    <label><i class="fa-solid fa-user-check"></i> Gmail or Username</label>
                    <input type="text" id="loginIdentifier" placeholder="Email or Username">
                    <span class="error-msg" id="identifierError"></span>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label><i class="fa-solid fa-key"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="forgot-pass">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="form-footer">
                New to NovaHealth? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <script src="/login.js"></script>
</body>
</html>
